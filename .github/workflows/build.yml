# Builds the Windows installer and the Linux AppImage and .deb. On a version tag (v0.1.0) the
# `draft` job creates the draft GitHub release from CHANGELOG.md and both builds upload to it
# (electron-builder --publish: the installer, its blockmap and latest.yml; the AppImage, the .deb
# and latest-linux.yml); on other pushes and pull requests the files are kept as workflow
# artifacts only. The `macos` job builds the arm64 dmg and zip; it signs and notarizes only when the
# repository has the five secrets of docs/CODE_SIGNING_POLICY.md, else it keeps an unsigned workflow artifact.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # electron-builder runs one publisher per file and races itself (and the other platform's job)
  # into several draft releases when none exists yet; creating the draft first makes all find it
  draft:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the version tag matches package.json
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          [ "refs/tags/v$v" = "$GITHUB_REF" ] || { echo "tag $GITHUB_REF but package.json says $v"; exit 1; }

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag=${GITHUB_REF#refs/tags/}
          # the release body is that version's section of CHANGELOG.md (tools/release_notes.py);
          # a missing section stops the release rather than shipping someone else's notes
          python tools/release_notes.py "$tag" > release_notes.md
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --draft --title "Scumble ${tag#v}" --notes-file release_notes.md

  windows:
    needs: draft
    # runs when the draft job succeeded or was skipped (not a tag), never after it failed
    if: ${{ !failure() && !cancelled() }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # tools/build_px.py below is a Python script
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: npm ci

      # a name that does not exist, a write to an imported binding or to a const: things that
      # parse fine and throw at run time (eslint.config.mjs says what is checked and why)
      - name: Lint
        shell: bash
        run: npx eslint .

      # the three contracts (the editor host, the command descriptors, the recipe shape) against
      # their typedefs; nothing is compiled, tsconfig.check.json says what is checked and why
      - name: Types
        shell: bash
        run: npx tsc --noEmit -p tsconfig.check.json

      # the committed renderer/editor/px/*.wasm must be what crates/px builds; rustup installs the compiler
      # crates/px/rust-toolchain.toml pins, with its wasm target, on the first cargo call
      - name: Check the Rust kernels against their source
        shell: bash
        run: python tools/build_px.py --check

      - name: Build installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then npx electron-builder --win nsis --publish always
          else npx electron-builder --win nsis --publish never; fi

      - uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/v')"
        with:
          name: Scumble-windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error

  linux:
    needs: draft
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # onnxruntime-node would fetch its CUDA provider (hundreds of MB) from NuGet on linux/x64;
      # the Linux build runs the helpers on the CPU (docs/HELPERS.md), so it is not fetched.
      # The Rust kernels are checked once, in the Windows job.
      - name: Install
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
        run: npm ci

      - name: Build AppImage and deb
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then npx electron-builder --linux --publish always
          else npx electron-builder --linux --publish never; fi

      - uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/v')"
        with:
          name: Scumble-linux
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/latest-linux.yml
          if-no-files-found: error

  macos:
    needs: draft
    if: ${{ !failure() && !cancelled() }}
    runs-on: macos-latest
    env:
      HAS_SIGNING: ${{ secrets.CSC_LINK != '' && secrets.APPLE_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # signed and notarized only when the repository has the five secrets (docs/CODE_SIGNING_POLICY.md); without
      # them an unsigned build is kept as a workflow artifact and nothing is attached to a release, because an
      # unsigned mac download is blocked by Gatekeeper
      - name: Build dmg and zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          if [ "$HAS_SIGNING" != "true" ]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; fi
          # always --publish never: electron-builder uploads a file the moment it is built, which is before
          # build/notarize-dmg.js has notarized and stapled the dmg; the upload below takes the finished files
          npx electron-builder --mac --arm64 --publish never
          if [[ "$GITHUB_REF" == refs/tags/v* && "$HAS_SIGNING" == "true" ]]; then
            gh release upload "${GITHUB_REF#refs/tags/}" dist/Scumble-*-arm64.dmg dist/Scumble-*-arm64.zip dist/Scumble-*-arm64.dmg.blockmap dist/Scumble-*-arm64.zip.blockmap dist/latest-mac.yml --clobber
          fi

      - uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/v') || env.HAS_SIGNING != 'true'"
        with:
          name: Scumble-macos
          path: |
            dist/*.dmg
            dist/*.zip
            dist/latest-mac.yml
          if-no-files-found: warn
